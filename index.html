<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生活小幫手：喝水與護眼 20-20-20 溫柔提醒器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        morandi: {
                            bg: '#F7F4F0',
                            card: '#FFFFFF',
                            primary: '#6B8E83',
                            'primary-dark': '#557268',
                            secondary: '#D0A98F',
                            accent: '#8C9DAE',
                            text: '#4A4A4A',
                            light: '#EAE6E1',
                            muted: '#9E9E9E'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #F7F4F0; color: #4A4A4A; font-family: system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 flex flex-col items-center justify-center">

    <div class="w-full max-w-4xl bg-morandi-card rounded-2xl shadow-sm border border-morandi-light p-6 md:p-8 mb-4">
        <!-- 頂部標題與狀態 -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center border-b border-morandi-light pb-4 mb-6 gap-4">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-morandi-primary/10 flex items-center justify-center text-morandi-primary font-bold text-xl">💧</div>
                <div>
                    <h1 class="text-2xl font-bold text-morandi-text">生活小幫手</h1>
                    <p class="text-xs text-morandi-muted">喝水與護眼 20-20-20 溫柔提醒器</p>
                </div>
            </div>
            <div class="flex items-center gap-2 flex-wrap">
                <button id="notif-btn" onclick="toggleNotification()" class="px-3 py-1.5 rounded-full text-xs font-medium bg-morandi-light text-morandi-text hover:bg-morandi-primary hover:text-white transition cursor-pointer">
                    🔔 開啟桌面通知
                </button>
                <button id="sound-toggle-btn" onclick="toggleSound()" class="px-3 py-1.5 rounded-full text-xs font-medium bg-morandi-primary/20 text-morandi-primary cursor-pointer">
                    🔊 音效開啟
                </button>
                <button onclick="testSound()" class="px-3 py-1.5 rounded-full text-xs font-medium bg-morandi-secondary/20 text-morandi-secondary hover:bg-morandi-secondary hover:text-white transition cursor-pointer">
                    試聽鈴聲
                </button>
            </div>
        </div>

        <!-- 雙欄主區塊 -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            
            <!-- 💧 飲水追蹤區塊 -->
            <div class="bg-morandi-bg/50 rounded-xl p-6 border border-morandi-light flex flex-col justify-between">
                <div>
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-lg font-bold text-morandi-text flex items-center gap-2">
                            <span>●</span> 今日飲水紀錄
                        </h2>
                        <div class="flex items-center gap-1 bg-white px-2.5 py-1 rounded-lg border border-morandi-light text-xs">
                            <span class="text-morandi-muted">目標</span>
                            <input type="number" id="water-goal-input" value="2000" step="100" min="500" max="5000" onchange="updateWaterGoal()" class="w-14 text-right font-bold text-morandi-primary bg-transparent focus:outline-none">
                            <span class="text-morandi-muted">cc</span>
                        </div>
                    </div>

                    <div class="flex items-center gap-6 mb-6">
                        <!-- 水瓶視覺圖 -->
                        <div class="w-24 h-36 bg-white rounded-xl border-2 border-morandi-primary/30 p-1.5 relative overflow-hidden flex flex-col justify-end shadow-inner">
                            <div id="water-fill" class="w-full bg-morandi-primary/30 rounded-lg transition-all duration-500" style="height: 0%;"></div>
                            <div class="absolute inset-0 flex items-center justify-center font-bold text-morandi-text text-sm drop-shadow-sm" id="water-percent">0%</div>
                        </div>
                        <div>
                            <div class="text-4xl font-extrabold text-morandi-text mb-1">
                                <span id="current-water">0</span><span class="text-lg font-normal text-morandi-muted"> / <span id="target-water-display">2000</span> cc</span>
                            </div>
                            <p class="text-sm text-morandi-primary font-medium" id="water-tip">先喝一杯溫開水開啟好精神吧！</p>
                        </div>
                    </div>

                    <!-- 快速新增按鈕 -->
                    <div class="mb-6">
                        <p class="text-xs text-morandi-muted mb-2">快速記錄一杯水：</p>
                        <div class="grid grid-cols-4 gap-2">
                            <button onclick="addWater(150)" class="py-2 bg-white hover:bg-morandi-primary hover:text-white border border-morandi-light rounded-lg text-xs font-semibold text-morandi-text transition shadow-sm cursor-pointer">+150 cc</button>
                            <button onclick="addWater(250)" class="py-2 bg-white hover:bg-morandi-primary hover:text-white border border-morandi-light rounded-lg text-xs font-semibold text-morandi-text transition shadow-sm cursor-pointer">+250 cc</button>
                            <button onclick="addWater(300)" class="py-2 bg-white hover:bg-morandi-primary hover:text-white border border-morandi-light rounded-lg text-xs font-semibold text-morandi-text transition shadow-sm cursor-pointer">+300 cc</button>
                            <button onclick="addWater(500)" class="py-2 bg-white hover:bg-morandi-primary hover:text-white border border-morandi-light rounded-lg text-xs font-semibold text-morandi-text transition shadow-sm cursor-pointer">+500 cc</button>
                        </div>
                    </div>
                </div>

                <!-- 喝水倒數計時器 -->
                <div class="bg-white p-4 rounded-xl border border-morandi-light">
                    <div class="flex justify-between items-center mb-2">
                        <span class="text-xs text-morandi-muted">喝水提醒間隔：每</span>
                        <select id="water-interval" onchange="changeWaterInterval()" class="text-xs bg-morandi-bg border border-morandi-light rounded px-2 py-1 text-morandi-text focus:outline-none cursor-pointer">
                            <option value="10">10 秒測試</option>
                            <option value="30">30 分鐘</option>
                            <option value="45" selected>45 分鐘</option>
                            <option value="60">60 分鐘</option>
                            <option value="90">90 分鐘</option>
                        </select>
                    </div>
                    <div class="flex items-center justify-between">
                        <span id="water-timer-display" class="text-2xl font-mono font-bold text-morandi-primary">45:00</span>
                        <div class="flex gap-2">
                            <button id="water-start-btn" onclick="toggleWaterTimer()" class="px-4 py-1.5 bg-morandi-primary text-white text-xs font-medium rounded-lg hover:bg-morandi-primary-dark transition shadow-sm cursor-pointer">開始計時</button>
                            <button onclick="resetWaterTimer()" class="p-1.5 bg-morandi-bg border border-morandi-light rounded-lg text-morandi-muted hover:text-morandi-text transition cursor-pointer">🔄</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 👀 護眼 20-20-20 區塊 -->
            <div class="bg-morandi-bg/50 rounded-xl p-6 border border-morandi-light flex flex-col justify-between">
                <div>
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-lg font-bold text-morandi-text flex items-center gap-2">
                            <span>●</span> 護眼 20-20-20
                        </h2>
                        <span id="eye-count-badge" class="text-xs bg-morandi-accent/20 text-morandi-text px-2.5 py-1 rounded-full font-medium">今日已護眼 0 次</span>
                    </div>

                    <div class="text-center bg-white rounded-xl p-6 border border-morandi-light mb-6 shadow-sm">
                        <div class="flex justify-center items-center gap-2 mb-2">
                            <span class="text-xs text-morandi-muted">專用眼間隔：每</span>
                            <select id="eye-interval" onchange="changeEyeInterval()" class="text-xs bg-morandi-bg border border-morandi-light rounded px-2 py-1 text-morandi-text focus:outline-none cursor-pointer">
                                <option value="0.1667">10 秒測試</option>
                                <option value="20" selected>20 分鐘</option>
                                <option value="30">30 分鐘</option>
                            </select>
                            <span class="text-xs text-morandi-muted">休息一次</span>
                        </div>
                        <div id="eye-timer-display" class="text-5xl font-mono font-extrabold text-morandi-text tracking-wider my-3">20:00</div>
                        <div class="w-full bg-morandi-light h-2 rounded-full overflow-hidden mb-2">
                            <div id="eye-progress" class="bg-morandi-secondary h-full transition-all duration-300" style="width: 100%;"></div>
                        </div>
                        <p class="text-xs text-morandi-muted">每用眼 20 分鐘，眺望 6 公尺遠方 20 秒並用力眨眼</p>
                    </div>
                </div>

                <!-- 護眼控制按鈕 (新增重置按鈕) -->
                <div class="space-y-2">
                    <div class="flex gap-2">
                        <button id="eye-start-btn" onclick="toggleEyeTimer()" class="flex-1 py-2.5 bg-morandi-accent text-white font-medium rounded-xl hover:bg-opacity-90 transition shadow-sm text-sm cursor-pointer">開始護眼計時</button>
                        <button onclick="resetEyeTimer()" class="px-3.5 py-2.5 bg-white border border-morandi-light rounded-xl text-morandi-muted hover:text-morandi-text transition cursor-pointer" title="重置計時">🔄</button>
                    </div>
                    <button onclick="triggerRestModal()" class="w-full py-2 bg-white border border-morandi-light text-morandi-text text-xs rounded-xl hover:bg-morandi-light transition cursor-pointer">眼睛酸了？立即啟動 20 秒望遠休息模式</button>
                </div>
            </div>

        </div>

        <div class="mt-6 pt-4 border-t border-morandi-light flex justify-between items-center text-xs text-morandi-muted">
            <span>✨ 資料會自動儲存於瀏覽器，每日午夜自動歸零重新計算。</span>
            <button onclick="resetAllData()" class="hover:text-morandi-text underline cursor-pointer">手動重置今日數據</button>
        </div>
    </div>

    <!-- 🔔 持續響鈴警報彈窗 -->
    <div id="alarm-modal" style="display: none;" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 items-center justify-center p-4">
        <div class="bg-white rounded-2xl p-8 max-w-md w-full text-center shadow-2xl border-4 border-morandi-secondary">
            <div id="alarm-icon" class="text-5xl mb-4">💧</div>
            <h3 id="alarm-title" class="text-2xl font-bold text-morandi-text mb-2">該喝水囉！</h3>
            <p id="alarm-desc" class="text-morandi-muted mb-6 text-sm">補充 250cc 溫開水，讓思緒更清晰，順便伸展一下身體～</p>
            <button onclick="dismissAlarm()" class="w-full py-3 bg-morandi-primary text-white font-bold rounded-xl hover:bg-morandi-primary-dark transition text-lg shadow-lg cursor-pointer">
                我知道了，關閉提醒 🔕
            </button>
        </div>
    </div>

    <!-- 👀 20秒護眼休息全螢幕遮罩 -->
    <div id="rest-modal" style="display: none;" class="fixed inset-0 bg-morandi-text/90 backdrop-blur-md z-50 flex-col items-center justify-center text-white p-4">
        <div
