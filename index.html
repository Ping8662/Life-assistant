<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生活小幫手：喝水與護眼提醒器</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Google Fonts: Noto Sans TC 與 Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'Noto Sans TC', 'sans-serif'],
                    },
                    colors: {
                        morandi: {
                            bg: '#F4F1EA',        // 暖米白底色
                            card: '#FAF8F5',      // 卡片柔白
                            border: '#E5DFD3',    // 柔和邊框
                            green: '#7B9E89',     // 莫蘭迪湖水綠 (主色)
                            greenDark: '#638470', // 湖水綠深色
                            greenLight: '#E3ECE6',// 湖水綠淺底
                            blue: '#7C93A6',      // 霧霾板岩藍 (護眼主色)
                            blueDark: '#62788B',  // 板岩藍深色
                            blueLight: '#E3E9EE', // 板岩藍淺底
                            text: '#4A4E4D',      // 深灰炭色文字
                            muted: '#8A8D8B',     // 次要輔助文字
                            accent: '#C99E8C'     // 莫蘭迪陶土粉 (警示/強調)
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* 自訂水波與動畫效果 */
        body {
            background-color: #F4F1EA;
            color: #4A4E4D;
            -webkit-font-smoothing: antialiased;
        }

        .water-fill {
            transition: height 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* 隱藏數字輸入框上下箭頭 */
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] {
            -moz-appearance: textfield;
        }

        /* 呼吸光圈動畫 (護眼20秒引導用) */
        @keyframes breathe {
            0%, 100% { transform: scale(1); opacity: 0.7; }
            50% { transform: scale(1.15); opacity: 1; }
        }
        .animate-breathe {
            animation: breathe 4s ease-in-out infinite;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 sm:p-6 selection:bg-morandi-greenLight">

    <!-- 主容器：限制最大寬度，確保在電腦角落小視窗也能完美呈現 -->
    <div class="max-w-4xl w-full mx-auto space-y-5">

        <!-- 頂部標題與系統控制列 -->
        <header class="bg-morandi-card border border-morandi-border rounded-2xl p-4 sm:px-6 shadow-sm flex flex-col sm:flex-row sm:items-center justify-between gap-3">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-morandi-greenLight text-morandi-greenDark flex items-center justify-center shrink-0">
                    <!-- 葉子與水滴圖示 -->
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 21a9 9 0 0 0 9-9c0-4.97-9-11-9-11S3 7.03 3 12a9 9 0 0 0 9 9z"/>
                    </svg>
                </div>
                <div>
                    <h1 class="text-lg sm:text-xl font-bold tracking-tight text-morandi-text">生活小幫手</h1>
                    <p class="text-xs text-morandi-muted">喝水與護眼 20-20-20 溫柔提醒器</p>
                </div>
            </div>

            <!-- 通知與音效控制按鈕組 -->
            <div class="flex flex-wrap items-center gap-2">
                <!-- 瀏覽器通知狀態按鈕 -->
                <button id="btn-notify" onclick="requestNotificationPermission()" 
                    class="flex items-center gap-1.5 px-3 py-2 rounded-xl text-xs font-medium border border-morandi-border bg-white hover:bg-morandi-bg transition-colors cursor-pointer">
                    <span id="notify-dot" class="w-2 h-2 rounded-full bg-amber-400"></span>
                    <span id="notify-text">開啟桌面通知</span>
                </button>

                <!-- 音效開關 -->
                <button id="btn-sound" onclick="toggleSound()" 
                    class="flex items-center gap-1.5 px-3 py-2 rounded-xl text-xs font-medium border border-morandi-border bg-white hover:bg-morandi-bg transition-colors cursor-pointer"
                    title="切換提示音效">
                    <svg id="icon-sound-on" class="w-4 h-4 text-morandi-greenDark" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/>
                    </svg>
                    <svg id="icon-sound-off" class="w-4 h-4 text-morandi-muted hidden" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15zM17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2"/>
                    </svg>
                    <span id="sound-text">音效開啟</span>
                </button>

                <!-- 測試音效按鈕 -->
                <button onclick="playChime('test')" 
                    class="px-3 py-2 rounded-xl text-xs font-medium bg-morandi-greenLight text-morandi-greenDark hover:bg-morandi-green hover:text-white transition-colors cursor-pointer">
                    試聽鈴聲
                </button>
            </div>
        </header>

        <!-- 雙核心模組網格：喝水模組 + 護眼模組 -->
        <main class="grid grid-cols-1 md:grid-cols-2 gap-5">

            <!-- ================= 模組一：喝水紀錄與提醒 ================= -->
            <section class="bg-morandi-card border border-morandi-border rounded-3xl p-5 sm:p-6 shadow-sm flex flex-col justify-between space-y-5">
                <div>
                    <!-- 卡片標題與目標設定 -->
                    <div class="flex items-center justify-between mb-4">
                        <div class="flex items-center gap-2">
                            <span class="w-3 h-3 rounded-full bg-morandi-green"></span>
                            <h2 class="text-base sm:text-lg font-bold text-morandi-text">今日飲水紀錄</h2>
                        </div>
                        <div class="flex items-center gap-1.5 text-xs text-morandi-muted bg-white px-2.5 py-1 rounded-lg border border-morandi-border">
                            <span>目標</span>
                            <input type="number" id="water-goal-input" value="1500" step="100" min="500" max="5000"
                                onchange="updateWaterGoal(this.value)"
                                class="w-12 text-center font-semibold text-morandi-greenDark bg-transparent focus:outline-none border-b border-dashed border-morandi-green">
                            <span>cc</span>
                        </div>
                    </div>

                    <!-- 視覺化水杯進度與數據 -->
                    <div class="flex items-center gap-5 bg-white/70 border border-morandi-border/60 rounded-2xl p-4">
                        <!-- 動態水杯圖示 -->
                        <div class="relative w-20 h-28 rounded-b-2xl rounded-t-md border-2 border-morandi-green/60 bg-morandi-bg overflow-hidden shrink-0 shadow-inner">
                            <!-- 水位高度 -->
                            <div id="water-visual-fill" class="water-fill absolute bottom-0 left-0 right-0 bg-morandi-green/80" style="height: 0%;">
                                <div class="w-full h-1.5 bg-white/30"></div>
                            </div>
                            <!-- 杯身刻度線 -->
                            <div class="absolute inset-0 flex flex-col justify-evenly pointer-events-none px-1.5 opacity-40">
                                <div class="w-3 border-t border-morandi-text"></div>
                                <div class="w-2 border-t border-morandi-text"></div>
                                <div class="w-3 border-t border-morandi-text"></div>
                            </div>
                        </div>

                        <!-- 數字進度區 -->
                        <div class="flex-1 space-y-1.5">
                            <div class="flex items-baseline gap-1.5">
                                <span id="water-current" class="text-3xl sm:text-4xl font-bold text-morandi-greenDark tracking-tight">0</span>
                                <span class="text-sm text-morandi-muted font-medium">/ <span id="water-goal-display">1500</span> cc</span>
                            </div>
                            <div class="flex items-center justify-between text-xs">
                                <span id="water-status-msg" class="text-morandi-muted">準備好補充水分了嗎？</span>
                                <span id="water-percent" class="font-bold text-morandi-greenDark">0%</span>
                            </div>
                            <!-- 橫向進度條 -->
                            <div class="w-full h-2 bg-morandi-bg rounded-full overflow-hidden">
                                <div id="water-bar-fill" class="h-full bg-morandi-green transition-all duration-500 rounded-full" style="width: 0%"></div>
                            </div>
                        </div>
                    </div>

                    <!-- 快速加水按鈕區 -->
                    <div class="mt-4">
                        <div class="flex items-center justify-between mb-2">
                            <span class="text-xs font-medium text-morandi-muted">快速紀錄一杯水：</span>
                            <button onclick="undoLastWater()" id="btn-water-undo" class="text-xs text-morandi-muted hover:text-morandi-accent underline hidden cursor-pointer">
                                復原上一筆
                            </button>
                        </div>
                        <div class="grid grid-cols-4 gap-2">
                            <button onclick="addWater(150)" class="py-2.5 px-1 rounded-xl bg-morandi-greenLight/80 hover:bg-morandi-green text-morandi-greenDark hover:text-white font-semibold text-xs sm:text-sm transition-all active:scale-95 cursor-pointer">
                                +150<span class="text-[10px] font-normal ml-0.5">cc</span>
                            </button>
                            <button onclick="addWater(250)" class="py-2.5 px-1 rounded-xl bg-morandi-greenLight/80 hover:bg-morandi-green text-morandi-greenDark hover:text-white font-semibold text-xs sm:text-sm transition-all active:scale-95 cursor-pointer">
                                +250<span class="text-[10px] font-normal ml-0.5">cc</span>
                            </button>
                            <button onclick="addWater(300)" class="py-2.5 px-1 rounded-xl bg-morandi-greenLight/80 hover:bg-morandi-green text-morandi-greenDark hover:text-white font-semibold text-xs sm:text-sm transition-all active:scale-95 cursor-pointer">
                                +300<span class="text-[10px] font-normal ml-0.5">cc</span>
                            </button>
                            <button onclick="addWater(500)" class="py-2.5 px-1 rounded-xl bg-morandi-greenLight/80 hover:bg-morandi-green text-morandi-greenDark hover:text-white font-semibold text-xs sm:text-sm transition-all active:scale-95 cursor-pointer">
                                +500<span class="text-[10px] font-normal ml-0.5">cc</span>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- 喝水間隔計時器 -->
                <div class="pt-4 border-t border-morandi-border flex flex-col sm:flex-row sm:items-center justify-between gap-3 bg-morandi-bg/50 p-3.5 rounded-2xl">
                    <div>
                        <div class="flex items-center gap-1.5 text-xs text-morandi-muted mb-0.5">
                            <span>喝水提醒間隔：每</span>
                            <select id="water-interval-select" onchange="changeWaterInterval(this.value)"
                                class="bg-white border border-morandi-border rounded-md px-1.5 py-0.5 font-semibold text-morandi-text focus:outline-none cursor-pointer">
                                <option value="30">30 分鐘</option>
                                <option value="45" selected>45 分鐘</option>
                                <option value="60">60 分鐘</option>
                                <option value="90">90 分鐘</option>
                            </select>
                        </div>
                        <div id="water-timer-display" class="text-2xl font-bold font-mono text-morandi-text tracking-wider">45:00</div>
                    </div>

                    <div class="flex items-center gap-2">
                        <button id="btn-water-toggle" onclick="toggleWaterTimer()"
                            class="flex-1 sm:flex-none px-4 py-2 rounded-xl bg-morandi-green hover:bg-morandi-greenDark text-white text-xs font-semibold transition-colors shadow-sm cursor-pointer">
                            開始計時
                        </button>
                        <button onclick="resetWaterTimer()"
                            class="p-2 rounded-xl bg-white border border-morandi-border hover:bg-morandi-bg text-morandi-muted transition-colors cursor-pointer" title="重設計時">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                            </svg>
                        </button>
                    </div>
                </div>
            </section>

            <!-- ================= 模組二：護眼 20-20-20 提醒 ================= -->
            <section class="bg-morandi-card border border-morandi-border rounded-3xl p-5 sm:p-6 shadow-sm flex flex-col justify-between space-y-5">
                <div>
                    <!-- 卡片標題與完成次數 -->
                    <div class="flex items-center justify-between mb-4">
                        <div class="flex items-center gap-2">
                            <span class="w-3 h-3 rounded-full bg-morandi-blue"></span>
                            <h2 class="text-base sm:text-lg font-bold text-morandi-text">護眼 20-20-20</h2>
                        </div>
                        <div class="text-xs bg-morandi-blueLight text-morandi-blueDark font-semibold px-3 py-1 rounded-full">
                            今日已護眼 <span id="eye-rest-count" class="text-sm font-bold mx-0.5">0</span> 次
                        </div>
                    </div>

                    <!-- 倒數計時主視覺框 -->
                    <div class="bg-white/70 border border-morandi-border/60 rounded-2xl p-5 text-center space-y-2 relative overflow-hidden">
                        <div class="text-xs text-morandi-muted flex items-center justify-center gap-1.5">
                            <span>專注用眼間隔：每</span>
                            <select id="eye-interval-select" onchange="changeEyeInterval(this.value)"
                                class="bg-morandi-bg border border-morandi-border rounded-md px-1.5 py-0.5 font-semibold text-morandi-blueDark focus:outline-none cursor-pointer">
                                <option value="15">15 分鐘</option>
                                <option value="20" selected>20 分鐘</option>
                                <option value="30">30 分鐘</option>
                                <option value="40">40 分鐘</option>
                            </select>
                            <span>休息一次</span>
                        </div>

                        <!-- 大字體倒數時間 -->
                        <div id="eye-timer-display" class="text-5xl sm:text-6xl font-bold font-mono text-morandi-blueDark tracking-wider py-2">
                            20:00
                        </div>

                        <!-- 護眼進度條 -->
                        <div class="w-full h-1.5 bg-morandi-bg rounded-full overflow-hidden">
                            <div id="eye-bar-fill" class="h-full bg-morandi-blue transition-all duration-1000 rounded-full" style="width: 100%"></div>
                        </div>

                        <p class="text-xs text-morandi-muted pt-1">
                            每用眼 20 分鐘，眺望 6 公尺遠方 20 秒並用力眨眼
                        </p>
                    </div>
                </div>

                <!-- 護眼計時控制按鈕區 -->
                <div class="space-y-2.5">
                    <div class="flex items-center gap-2.5">
                        <button id="btn-eye-toggle" onclick="toggleEyeTimer()"
                            class="flex-1 py-3 px-4 rounded-xl bg-morandi-blue hover:bg-morandi-blueDark text-white font-semibold text-sm transition-colors shadow-sm cursor-pointer">
                            開始護眼計時
                        </button>
                        <button onclick="resetEyeTimer()"
                            class="p-3 rounded-xl bg-white border border-morandi-border hover:bg-morandi-bg text-morandi-muted transition-colors cursor-pointer" title="重設護眼計時">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                            </svg>
                        </button>
                    </div>

                    <!-- 立即進入20秒休息按鈕 -->
                    <button onclick="triggerEyeRestOverlay()"
                        class="w-full py-2 rounded-xl bg-morandi-blueLight/70 hover:bg-morandi-blueLight text-morandi-blueDark text-xs font-medium transition-colors cursor-pointer">
                        眼睛酸了？立即啟動 20 秒望遠休息模式
                    </button>
                </div>
            </section>

        </main>

        <!-- 底部狀態提示與資訊欄 -->
        <footer class="text-center text-xs text-morandi-muted py-2 flex flex-col sm:flex-row items-center justify-between gap-2 px-2">
            <span id="toast-bar" class="text-morandi-greenDark font-medium min-h-[18px]">✨ 數據會自動儲存於瀏覽器，每日午夜自動歸零重新計算。</span>
            <button onclick="manualResetToday()" class="text-morandi-muted hover:text-morandi-accent underline cursor-pointer">
                手動重置今日數據
            </button>
        </footer>
    </div>

    <!-- ================= 全螢幕 20 秒護眼引導遮罩 ================= -->
    <div id="eye-rest-overlay" class="fixed inset-0 z-50 bg-[#2C3531]/95 backdrop-blur-md hidden flex-col items-center justify-center p-6 text-center text-[#F4F1EA]">
        <div class="max-w-md w-full space-y-6">
            <div class="inline-flex items-center gap-2 px-3.5 py-1 rounded-full bg-morandi-blue/30 text-morandi-blueLight text-xs font-medium tracking-wide">
                <span>🌿 20-20-20 護眼時間</span>
            </div>

            <h2 class="text-2xl sm:text-3xl font-bold tracking-tight">請將視線移開螢幕</h2>
            <p class="text-sm sm:text-base text-[#D3D7D4] leading-relaxed">
                看看 <strong class="text-white underline decoration-morandi-green">6 公尺（20 呎）以外的遠方</strong>（例如窗外樹梢或遠處建築），順便用力眨眼 5 次滋潤眼球！
            </p>

            <!-- 20秒呼吸倒數圓圈 -->
            <div class="relative w-40 h-40 mx-auto flex items-center justify-center my-4">
                <div class="absolute inset-0 rounded-full bg-morandi-green/25 animate-breathe"></div>
                <div class="relative w-32 h-32 rounded-full bg-morandi-card text-morandi-text flex flex-col items-center justify-center shadow-lg">
                    <span id="overlay-seconds" class="text-4xl font-bold font-mono text-morandi-greenDark">20</span>
                    <span class="text-[11px] text-morandi-muted mt-0.5">秒後自動結束</span>
                </div>
            </div>

            <div class="pt-2 flex items-center justify-center gap-3">
                <button onclick="completeEyeRest(true)" class="px-5 py-2.5 rounded-xl bg-morandi-green hover:bg-morandi-greenDark text-white text-sm font-medium transition-colors cursor-pointer">
                    我休息好了（計入次數）
                </button>
                <button onclick="closeEyeRestOverlay()" class="px-4 py-2.5 rounded-xl bg-white/10 hover:bg-white/20 text-white/80 text-xs transition-colors cursor-pointer">
                    略過本次
                </button>
            </div>
        </div>
    </div>

    <!-- JavaScript 核心邏輯 -->
    <script>
        // ================= 1. 狀態與 LocalStorage 管理 =================
        const STORAGE_KEY = 'morandi_health_helper_v1';

        function getTodayDateString() {
            const now = new Date();
            return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
        }

        // 預設狀態
        let appState = {
            date: getTodayDateString(),
            waterCurrent: 0,
            waterHistory: [], // 記錄每次加水量，方便復原
            waterGoal: 1500,
            waterIntervalMin: 45,
            eyeRestCount: 0,
            eyeIntervalMin: 20,
            soundEnabled: true
        };

        // 計時器運行變數
        let waterSecondsLeft = 45 * 60;
        let waterTimerRunning = false;
        let waterTimerId = null;

        let eyeSecondsLeft = 20 * 60;
        let eyeTimerRunning = false;
        let eyeTimerId = null;

        let overlaySecondsLeft = 20;
        let overlayTimerId = null;

        // 初始化載入資料
        function loadState() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    const parsed = JSON.parse(saved);
                    const today = getTodayDateString();

                    // 保留設定值
                    appState.waterGoal = parsed.waterGoal || 1500;
                    appState.waterIntervalMin = parsed.waterIntervalMin || 45;
                    appState.eyeIntervalMin = parsed.eyeIntervalMin || 20;
                    appState.soundEnabled = parsed.soundEnabled !== undefined ? parsed.soundEnabled : true;

                    // 檢查是否跨日：若同一天則載入今日進度，若跨日則自動歸零
                    if (parsed.date === today) {
                        appState.date = today;
                        appState.waterCurrent = parsed.waterCurrent || 0;
                        appState.waterHistory = parsed.waterHistory || [];
                        appState.eyeRestCount = parsed.eyeRestCount || 0;
                    } else {
                        appState.date = today;
                        appState.waterCurrent = 0;
                        appState.waterHistory = [];
                        appState.eyeRestCount = 0;
                        saveState();
                    }
                }
            } catch (e) {
                console.error('讀取儲存資料失敗:', e);
            }

            // 同步時間設定到倒數器
            waterSecondsLeft = appState.waterIntervalMin * 60;
            eyeSecondsLeft = appState.eyeIntervalMin * 60;

            // 同步下拉選單與輸入框 UI
            document.getElementById('water-goal-input').value = appState.waterGoal;
            document.getElementById('water-interval-select').value = appState.waterIntervalMin;
            document.getElementById('eye-interval-select').value = appState.eyeIntervalMin;

            updateSoundUI();
            updateWaterUI();
            updateEyeUI();
            updateWaterTimerDisplay();
            updateEyeTimerDisplay();
            checkNotificationStatus();
        }

        function saveState() {
            try {
                appState.date = getTodayDateString();
                localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
            } catch (e) {
                console.error('儲存資料失敗:', e);
            }
        }

        // 每分鐘檢查一次是否跨過午夜 00:00，自動歸零
        setInterval(() => {
            const today = getTodayDateString();
            if (appState.date !== today) {
                appState.date = today;
                appState.waterCurrent = 0;
                appState.waterHistory = [];
                appState.eyeRestCount = 0;
                saveState();
                updateWaterUI();
                updateEyeUI();
                showToast('🌅 新的一天開始囉！飲水與護眼紀錄已自動歸零。');
            }
        }, 60000);

        // ================= 2. Web Audio API 溫柔風鈴音效 =================
        let audioCtx = null;

        function playChime(type = 'water') {
            if (!appState.soundEnabled && type !== 'test') return;

            try {
                if (!audioCtx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    audioCtx = new AudioContext();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }

                const now = audioCtx.currentTime;
                // 選擇和弦音頻：喝水清脆水滴感 (C5 - E5 - G5)，護眼溫柔療癒和弦 (F4 - A4 - C5 - E5)
                const notes = type === 'eye' ? [349.23, 440.00, 523.25, 659.25] : [523.25, 659.25, 783.99];

                notes.forEach((freq, index) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();

                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, now + index * 0.18);

                    // 柔和的淡入與長尾音淡出 (風鈴質感)
                    gain.gain.setValueAtTime(0.001, now + index * 0.18);
                    gain.gain.exponentialRampToValueAtTime(0.18, now + index * 0.18 + 0.04);
                    gain.gain.exponentialRampToValueAtTime(0.0001, now + index * 0.18 + 1.4);

                    osc.connect(gain);
                    gain.connect(audioCtx.destination);

                    osc.start(now + index * 0.18);
                    osc.stop(now + index * 0.18 + 1.5);
                });

                if (type === 'test') {
                    showToast('🔔 已播放溫柔風鈴提示音');
                }
            } catch (e) {
                console.warn('無法播放音效:', e);
            }
        }

        function toggleSound() {
            appState.soundEnabled = !appState.soundEnabled;
            saveState();
            updateSoundUI();
            if (appState.soundEnabled) {
                playChime('test');
            }
        }

        function updateSoundUI() {
            const iconOn = document.getElementById('icon-sound-on');
            const iconOff = document.getElementById('icon-sound-off');
            const text = document.getElementById('sound-text');

            if (appState.soundEnabled) {
                iconOn.classList.remove('hidden');
                iconOff.classList.add('hidden');
                text.textContent = '音效開啟';
            } else {
                iconOn.classList.add('hidden');
                iconOff.classList.remove('hidden');
                text.textContent = '靜音模式';
            }
        }

        // ================= 3. 瀏覽器桌面通知管理 =================
        function checkNotificationStatus() {
            const dot = document.getElementById('notify-dot');
            const text = document.getElementById('notify-text');

            if (!('Notification' in window)) {
                dot.className = 'w-2 h-2 rounded-full bg-gray-400';
                text.textContent = '瀏覽器不支援通知';
                return;
            }

            if (Notification.permission === 'granted') {
                dot.className = 'w-2 h-2 rounded-full bg-morandi-green';
                text.textContent = '桌面通知已啟用';
            } else if (Notification.permission === 'denied') {
                dot.className = 'w-2 h-2 rounded-full bg-morandi-accent';
                text.textContent = '通知已被封鎖';
            } else {
                dot.className = 'w-2 h-2 rounded-full bg-amber-400';
                text.textContent = '開啟桌面通知';
            }
        }

        function requestNotificationPermission() {
            if (!('Notification' in window)) {
                showToast('⚠️ 您的瀏覽器不支援桌面通知功能。');
                return;
            }

            if (Notification.permission === 'granted') {
                sendBrowserNotification('生活小幫手通知測試', '太棒了！時間到時我會像這樣溫柔提醒您喝水與休息。');
                return;
            }

            Notification.requestPermission().then(permission => {
                checkNotificationStatus();
                if (permission === 'granted') {
                    sendBrowserNotification('已開啟提醒通知！', '接下來我會在您專注工作時定時提醒您。');
                    showToast('✅ 桌面通知權限已開啟！');
                } else {
                    showToast('ℹ️ 未開啟通知權限，時間到時仍會有網頁音效提醒。');
                }
            });
        }

        function sendBrowserNotification(title, body) {
            if ('Notification' in window && Notification.permission === 'granted') {
                try {
                    const notification = new Notification(title, {
                        body: body,
                        silent: true // 由網頁自己的 Web Audio 發出更溫柔的風鈴聲
                    });
                    notification.onclick = () => {
                        window.focus();
                        notification.close();
                    };
                } catch (e) {
                    console.warn('發送通知失敗:', e);
                }
            }
        }

        // ================= 4. 喝水追蹤與計時功能 =================
        function addWater(amount) {
            // 檢查跨日
            if (appState.date !== getTodayDateString()) loadState();

            appState.waterCurrent += amount;
            appState.waterHistory.push(amount);
            saveState();
            updateWaterUI();

            // 喝水後貼心自動重置喝水倒數計時器，並繼續計時（若原本有開啟）
            waterSecondsLeft = appState.waterIntervalMin * 60;
            updateWaterTimerDisplay();
            showToast(`💧 已紀錄 +${amount}cc！喝水倒數計時已自動重新計算。`);
        }

        function undoLastWater() {
            if (appState.waterHistory.length === 0) return;
            const last = appState.waterHistory.pop();
            appState.waterCurrent = Math.max(0, appState.waterCurrent - last);
            saveState();
            updateWaterUI();
            showToast(`↩️ 已復原上一筆 (${last}cc) 飲水紀錄。`);
        }

        function updateWaterGoal(newGoal) {
            const val = parseInt(newGoal, 10);
            if (isNaN(val) || val < 300) return;
            appState.waterGoal = val;
            saveState();
            updateWaterUI();
            showToast(`🎯 每日飲水目標已更新為 ${val}cc`);
        }

        function updateWaterUI() {
            const current = appState.waterCurrent;
            const goal = appState.waterGoal;
            const percent = Math.min(100, Math.round((current / goal) * 100));

            document.getElementById('water-current').textContent = current;
            document.getElementById('water-goal-display').textContent = goal;
            document.getElementById('water-percent').textContent = `${percent}%`;

            // 更新水杯與進度條動畫高度
            document.getElementById('water-visual-fill').style.height = `${percent}%`;
            document.getElementById('water-bar-fill').style.width = `${percent}%`;

            // 鼓勵語句
            const msgEl = document.getElementById('water-status-msg');
            if (current === 0) {
                msgEl.textContent = '先喝一杯溫開水開啟好精神吧！';
            } else if (percent < 50) {
                msgEl.textContent = `還差 ${goal - current} cc，慢慢補充很棒喔！`;
            } else if (percent < 100) {
                msgEl.textContent = `已經過半啦！再喝 ${goal - current} cc 就達標！`;
            } else {
                msgEl.textContent = '🎉 太厲害了！今日飲水目標已達成！';
            }

            // 顯示/隱藏復原按鈕
            const undoBtn = document.getElementById('btn-water-undo');
            if (appState.waterHistory.length > 0) {
                undoBtn.classList.remove('hidden');
            } else {
                undoBtn.classList.add('hidden');
            }
        }

        function changeWaterInterval(mins) {
            appState.waterIntervalMin = parseInt(mins, 10);
            saveState();
            resetWaterTimer();
        }

        function updateWaterTimerDisplay() {
            const m = Math.floor(waterSecondsLeft / 60);
            const s = waterSecondsLeft % 60;
            document.getElementById('water-timer-display').textContent =
                `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }

        function toggleWaterTimer() {
            const btn = document.getElementById('btn-water-toggle');
            if (waterTimerRunning) {
                clearInterval(waterTimerId);
                waterTimerRunning = false;
                btn.textContent = '繼續計時';
                btn.classList.replace('bg-morandi-accent', 'bg-morandi-green');
            } else {
                waterTimerRunning = true;
                btn.textContent = '暫停提醒';
                btn.classList.replace('bg-morandi-green', 'bg-morandi-accent');

                waterTimerId = setInterval(() => {
                    if (waterSecondsLeft > 0) {
                        waterSecondsLeft--;
                        updateWaterTimerDisplay();
                    } else {
                        // 時間到！觸發喝水提醒
                        playChime('water');
                        sendBrowserNotification('💧 該喝口水囉！', `已經過了 ${appState.waterIntervalMin} 分鐘，起來喝杯水潤潤喉吧！`);
                        showToast('💧 喝水時間到！喝完記得點上方按鈕紀錄喔～');
                        // 自動重置並繼續下一輪倒數
                        waterSecondsLeft = appState.waterIntervalMin * 60;
                        updateWaterTimerDisplay();
                    }
                }, 1000);
            }
        }

        function resetWaterTimer() {
            clearInterval(waterTimerId);
            waterTimerRunning = false;
            waterSecondsLeft = appState.waterIntervalMin * 60;
            updateWaterTimerDisplay();
            const btn = document.getElementById('btn-water-toggle');
            btn.textContent = '開始計時';
            btn.className = 'flex-1 sm:flex-none px-4 py-2 rounded-xl bg-morandi-green hover:bg-morandi-greenDark text-white text-xs font-semibold transition-colors shadow-sm cursor-pointer';
        }

        // ================= 5. 護眼 20-20-20 計時與引導遮罩 =================
        function updateEyeUI() {
            document.getElementById('eye-rest-count').textContent = appState.eyeRestCount;
        }

        function changeEyeInterval(mins) {
            appState.eyeIntervalMin = parseInt(mins, 10);
            saveState();
            resetEyeTimer();
        }

        function updateEyeTimerDisplay() {
            const m = Math.floor(eyeSecondsLeft / 60);
            const s = eyeSecondsLeft % 60;
            document.getElementById('eye-timer-display').textContent =
                `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;

            const totalSeconds = appState.eyeIntervalMin * 60;
            const pct = Math.max(0, Math.min(100, (eyeSecondsLeft / totalSeconds) * 100));
            document.getElementById('eye-bar-fill').style.width = `${pct}%`;
        }

        function toggleEyeTimer() {
            const btn = document.getElementById('btn-eye-toggle');
            if (eyeTimerRunning) {
                clearInterval(eyeTimerId);
                eyeTimerRunning = false;
                btn.textContent = '繼續護眼計時';
                btn.classList.replace('bg-morandi-accent', 'bg-morandi-blue');
            } else {
                eyeTimerRunning = true;
                btn.textContent = '暫停護眼計時';
                btn.classList.replace('bg-morandi-blue', 'bg-morandi-accent');

                eyeTimerId = setInterval(() => {
                    if (eyeSecondsLeft > 0) {
                        eyeSecondsLeft--;
                        updateEyeTimerDisplay();
                    } else {
                        // 時間到！暫停主計時器並跳出 20 秒望遠引導
                        clearInterval(eyeTimerId);
                        eyeTimerRunning = false;
                        playChime('eye');
                        sendBrowserNotification('👀 讓眼睛休息 20 秒吧！', '視線移開螢幕，看看 6 公尺外的遠方並眨眨眼。');
                        triggerEyeRestOverlay(true);
                    }
                }, 1000);
            }
        }

        function resetEyeTimer() {
            clearInterval(eyeTimerId);
            eyeTimerRunning = false;
            eyeSecondsLeft = appState.eyeIntervalMin * 60;
            updateEyeTimerDisplay();
            const btn = document.getElementById('btn-eye-toggle');
            btn.textContent = '開始護眼計時';
            btn.className = 'flex-1 py-3 px-4 rounded-xl bg-morandi-blue hover:bg-morandi-blueDark text-white font-semibold text-sm transition-colors shadow-sm cursor-pointer';
        }

        // 開啟 20 秒護眼休息全螢幕引導
        let autoResumeEyeAfterOverlay = false;

        function triggerEyeRestOverlay(autoResume = false) {
            autoResumeEyeAfterOverlay = autoResume;
            // 若主計時器正在跑，先暫停
            if (eyeTimerRunning) {
                clearInterval(eyeTimerId);
                eyeTimerRunning = false;
            }

            const overlay = document.getElementById('eye-rest-overlay');
            overlay.classList.remove('hidden');
            overlay.classList.add('flex');

            overlaySecondsLeft = 20;
            document.getElementById('overlay-seconds').textContent = overlaySecondsLeft;

            clearInterval(overlayTimerId);
            overlayTimerId = setInterval(() => {
                overlaySecondsLeft--;
                document.getElementById('overlay-seconds').textContent = overlaySecondsLeft;
                if (overlaySecondsLeft <= 0) {
                    clearInterval(overlayTimerId);
                    playChime('water'); // 休息結束輕響一聲
                    completeEyeRest(autoResumeEyeAfterOverlay);
                }
            }, 1000);
        }

        function completeEyeRest(shouldResume = false) {
            clearInterval(overlayTimerId);
            closeEyeRestOverlay(false);

            // 增加今日護眼完成次數
            if (appState.date !== getTodayDateString()) loadState();
            appState.eyeRestCount += 1;
            saveState();
            updateEyeUI();

            // 重置護眼計時器
            eyeSecondsLeft = appState.eyeIntervalMin * 60;
            updateEyeTimerDisplay();
            showToast('🌿 完成一次 20 秒護眼休息！眼睛感謝您～');

            if (shouldResume) {
                toggleEyeTimer();
            } else {
                const btn = document.getElementById('btn-eye-toggle');
                btn.textContent = '開始護眼計時';
                btn.className = 'flex-1 py-3 px-4 rounded-xl bg-morandi-blue hover:bg-morandi-blueDark text-white font-semibold text-sm transition-colors shadow-sm cursor-pointer';
            }
        }

        function closeEyeRestOverlay(resetTimer = true) {
            clearInterval(overlayTimerId);
            const overlay = document.getElementById('eye-rest-overlay');
            overlay.classList.add('hidden');
            overlay.classList.remove('flex');

            if (resetTimer) {
                resetEyeTimer();
            }
        }

        // ================= 6. 輔助工具函數 =================
        let toastTimeout = null;
        function showToast(msg) {
            const bar = document.getElementById('toast-bar');
            bar.textContent = msg;
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                bar.textContent = '✨ 數據會自動儲存於瀏覽器，每日午夜自動歸零重新計算。';
            }, 5000);
        }

        function manualResetToday() {
            // 不使用 alert/confirm，採用兩段式點擊確認避免誤觸
            const btn = event.target;
            if (btn.dataset.confirm !== 'true') {
                btn.dataset.confirm = 'true';
                btn.textContent = '確定要歸零今日喝水與護眼次數嗎？（再點一次確認）';
                btn.classList.add('text-morandi-accent', 'font-bold');
                setTimeout(() => {
                    btn.dataset.confirm = 'false';
                    btn.textContent = '手動重置今日數據';
                    btn.classList.remove('text-morandi-accent', 'font-bold');
                }, 4000);
                return;
            }

            appState.waterCurrent = 0;
            appState.waterHistory = [];
            appState.eyeRestCount = 0;
            saveState();
            updateWaterUI();
            updateEyeUI();
            btn.dataset.confirm = 'false';
            btn.textContent = '手動重置今日數據';
            btn.classList.remove('text-morandi-accent', 'font-bold');
            showToast('🔄 今日飲水與護眼紀錄已手動歸零。');
        }

        // 網頁載入完成時初始化
        window.addEventListener('DOMContentLoaded', loadState);
    </script>
</body>
</html>
